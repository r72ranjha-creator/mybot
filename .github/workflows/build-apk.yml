name: Build MyBot APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: MyBot-APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Versions
        run: flutter --version && java -version

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      # Release is signed with the debug keystore generated on the runner, so
      # the artifact installs by sideloading and the repo holds no secrets.
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename artifact
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk out/MyBot-APK.apk
          ls -lh out

      - name: Upload MyBot-APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBot-APK
          path: out/MyBot-APK.apk
          if-no-files-found: error
          retention-days: 30
