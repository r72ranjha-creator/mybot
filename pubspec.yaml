name: mybot
description: "MyBot — a phone-only AI assistant for Android that plans, routes and executes tasks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  intl: ^0.19.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  html: ^0.15.5
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.1
  crypto: ^3.0.8
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
